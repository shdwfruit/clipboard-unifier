<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>clipboard-unifier: iPhone ↔ Mac over Apple's Universal Clipboard, Mac ↔ Windows/Linux over an encrypted local-network mesh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>

  <!-- iPhone -->
  <g transform="translate(70,105)">
    <rect width="190" height="170" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="77" y="26" width="36" height="62" rx="8" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="89" y1="34" x2="101" y2="34" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="122" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">iPhone</text>
    <text x="95" y="148" text-anchor="middle" font-size="14" fill="#94a3b8">nothing to install</text>
  </g>

  <!-- Mac -->
  <g transform="translate(505,105)">
    <rect width="190" height="170" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="57" y="28" width="76" height="48" rx="5" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="47" y1="84" x2="143" y2="84" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <text x="95" y="122" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">Mac</text>
    <text x="95" y="148" text-anchor="middle" font-size="14" fill="#38bdf8">the bridge</text>
  </g>

  <!-- Windows -->
  <g transform="translate(940,40)">
    <rect width="190" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <g transform="translate(77,22)" fill="#e2e8f0">
      <rect width="16" height="16" rx="2"/><rect x="20" width="16" height="16" rx="2"/>
      <rect y="20" width="16" height="16" rx="2"/><rect x="20" y="20" width="16" height="16" rx="2"/>
    </g>
    <text x="95" y="88" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">Windows</text>
    <text x="95" y="112" text-anchor="middle" font-size="14" fill="#fbbf24">experimental</text>
  </g>

  <!-- Linux -->
  <g transform="translate(940,210)">
    <rect width="190" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="95" y="48" text-anchor="middle" font-size="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#e2e8f0">&gt;_</text>
    <text x="95" y="88" text-anchor="middle" font-size="22" font-weight="600" fill="#f8fafc">Linux</text>
    <text x="95" y="112" text-anchor="middle" font-size="14" fill="#94a3b8">X11 · Wayland</text>
  </g>

  <!-- iPhone <-> Mac -->
  <line x1="272" y1="190" x2="493" y2="190" stroke="#94a3b8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="382" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">Apple Universal Clipboard</text>
  <text x="382" y="218" text-anchor="middle" font-size="13" fill="#94a3b8">Bluetooth LE + AWDL</text>

  <!-- Mac <-> Windows / Linux -->
  <path d="M707,175 C 800,175 830,105 928,105" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M707,205 C 800,205 830,275 928,275" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="818" y="182" text-anchor="middle" font-size="15" font-weight="600" fill="#e2e8f0">clipboard-unifier</text>
  <text x="818" y="204" text-anchor="middle" font-size="13" fill="#94a3b8">Noise-encrypted LAN</text>
</svg>
