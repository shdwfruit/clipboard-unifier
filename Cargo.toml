[package]
name = "clipboard-unifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Extend Apple's Universal Clipboard from your iPhone to Windows and Linux, using your Mac as the bridge"
license = "MIT"
repository = "https://github.com/shdwfruit/clipboard-unifier"
readme = "README.md"
keywords = ["clipboard", "universal-clipboard", "iphone", "continuity", "sync"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
directories = "6.0.0"
gethostname = "1.1.0"
hex = "0.4.3"
hkdf = "0.13.0"
mdns-sd = "0.21.5"
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
sha2 = "0.11.1"
snow = { version = "0.10.0", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSAutoreleasePool"] }

[target."cfg(windows)".dependencies]
arboard = "3.7.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
arboard = { version = "3.7.0", features = ["wayland-data-control"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
strip = true
